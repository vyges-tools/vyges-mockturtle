name: release

# On-demand release: build the `vyges-emap` x86_64 binary from the pinned
# mockturtle commit and publish it as a relocatable tarball (GH Release) +
# index.json. No container — the binary drops into the OpenROAD/flow container
# or runs on an x86_64 host.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version YYYY.MM.N (e.g. 2026.07.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-${{ vars.VYGES_UBUNTU_VERSION || '24.04' }}   # ubuntu 24.04 → glibc 2.39 tarball floor
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pin
        id: pin
        run: |
          COMMIT=$(grep -E '^\s*commit:' upstream.yaml | awk '{print $2}')
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "short=$(echo "$COMMIT" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Build x86_64 tarball
        env:
          MT_COMMIT: ${{ steps.pin.outputs.commit }}
          VERSION: ${{ inputs.version }}
        run: bash scripts/build.sh

      # Runner and glibc floor, one policy for every release: vyges-tools/actions.
      - name: glibc ceiling
        uses: vyges-tools/actions/glibc-ceiling@v1
        with:
          runner: ubuntu-${{ vars.VYGES_UBUNTU_VERSION || '24.04' }}
          working-directory: .
          paths: dist

      - name: Smoke the tarball
        run: bash scripts/smoke.sh "dist/vyges-mockturtle-${{ inputs.version }}-g${{ steps.pin.outputs.short }}"

      - name: GitHub Release with the tarball
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: vyges-mockturtle ${{ inputs.version }}
          body: |
            File-level multi-output techmapping driver (mockturtle `emap`) — **x86_64 binary**.
            Drop `bin/vyges-emap` into the OpenROAD/flow container, or run on an x86_64 host
            (glibc ≥ 2.39). Reproducibly built from mainline mockturtle.
            - upstream mockturtle commit: `${{ steps.pin.outputs.commit }}`
          files: dist/*.tar.gz

      - name: Append to index.json
        run: |
          bash scripts/update-index.sh \
            "${{ steps.pin.outputs.commit }}" "${{ steps.pin.outputs.short }}" "${{ inputs.version }}" \
            "https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/vyges-mockturtle-${{ inputs.version }}-g${{ steps.pin.outputs.short }}-linux-x86_64.tar.gz"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json && git commit -m "index: ${{ inputs.version }} (${{ steps.pin.outputs.short }})" && git push
